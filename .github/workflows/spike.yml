name: Spike preview render

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_SILENCE_ROOT_WARNING: "1"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BRAITG/zero-gx
          ref: feat/community-previews  # TODO: master once #42 and this branch merge
          path: tool
          persist-credentials: false
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          rm /tmp/godot.zip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri
      - run: ~/godot/godot --headless --path tool --import
      - name: Render thumbnails (xvfb, opengl3)
        run: xvfb-run -a ~/godot/godot --path tool --rendering-driver opengl3 -s res://tools/render_thumbnails.gd
      - run: ls -l tool/build/thumbnails | head
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-thumbnails
          path: tool/build/thumbnails/level_09.png
